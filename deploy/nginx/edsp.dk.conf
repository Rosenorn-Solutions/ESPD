map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

upstream espd_web {
    server 127.0.0.1:3005;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name edsp.dk www.edsp.dk;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://edsp.dk$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name edsp.dk www.edsp.dk;

    ssl_certificate /etc/letsencrypt/live/edsp.dk/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/edsp.dk/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 10m;

    location /_next/static/ {
        alias /var/www/edsp/frontend/current/.next/static/;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /images/ {
        alias /var/www/edsp/frontend/current/public/images/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://espd_web;
        proxy_http_version 1.1;
        proxy_read_timeout 75s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 75s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}